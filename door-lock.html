<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玄関の開け方 | Izu High Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F4EE;
    --paper: #FFFFFF;
    --ink: #2E2B25;
    --ink-soft: #6B6558;
    --line: #E4DECF;
    --moss: #6E7A5A;
    --wood: #AD8552;
    --wood-soft: #F1E6D6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 64px;
  }
  header.hero{
    padding: 48px 20px 32px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    font-size: 13px;
    color: var(--moss);
    letter-spacing: 0.04em;
    margin: 0 0 10px;
  }
  h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: clamp(26px, 6.5vw, 34px);
    line-height: 1.45;
    margin: 0 0 14px;
    max-width: 640px;
  }
  .lede{
    font-size: 15.5px;
    color: var(--ink-soft);
    margin: 0;
    max-width: 46em;
  }
  main{
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .lock-media{
    width: 42%;
    min-width: 220px;
    line-height: 0;
    background: #EDE8DC;
  }
  .lock-media img{
    width: 100%;
    height: auto;
    display: block;
  }
  .steps{
    flex: 1;
    min-width: 260px;
  }
  .step{
    padding: 28px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 16px;
  }
  .step:first-of-type{ padding-top: 32px; }
  .step:last-of-type{ border-bottom: none; }
  .step-num{
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--wood);
    color: #FFF9F0;
    font-family: "Shippori Mincho", serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-text h2{
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  .step-text p{
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
  }
  .note{
    margin: 32px auto 0;
    max-width: 640px;
    padding: 0 20px;
  }
  .note-box{
    background: var(--wood-soft);
    border-radius: 4px;
    padding: 18px 20px;
    font-size: 14.5px;
    color: var(--ink);
  }
  .note-box p{ margin: 0; }
  .note-box strong{
    color: var(--moss);
    display: block;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .footer-note{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  @media (max-width: 480px){
    .lock-media{ width: 100%; }
  }

.langbtn{position:fixed;top:14px;right:14px;z-index:30;appearance:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;}
.scrim.open{opacity:1;pointer-events:auto;}
.langsheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--paper);border-radius:16px 16px 0 0;padding:6px 0 max(10px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;}
.langsheet.open{transform:translateY(0);}
.langsheet h3{margin:0;padding:16px 20px 8px;font-size:13px;font-weight:500;color:var(--ink-soft);}
.langsheet button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 20px;font-size:16px;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit;}
.langsheet button[aria-selected="true"]{color:var(--moss);font-weight:700;}
.langsheet button .tick{margin-left:auto;visibility:hidden;}
.langsheet button[aria-selected="true"] .tick{visibility:visible;}
</style>
</head>
<body>
<button class="langbtn" id="langbtn" aria-label="Language">JA</button>
<div class="scrim" id="scrim"></div>
<div class="langsheet" id="langsheet">
  <h3 data-i18n="lang_title">言語 / Language</h3>
  <button data-lang="ja"><span>日本語</span><span class="tick">✓</span></button>
  <button data-lang="en"><span>English</span><span class="tick">✓</span></button>
  <button data-lang="zh-CN"><span>简体中文</span><span class="tick">✓</span></button>
  <button data-lang="zh-TW"><span>繁體中文</span><span class="tick">✓</span></button>
  <button data-lang="ko"><span>한국어</span><span class="tick">✓</span></button>
</div>


<header class="hero">
  <p class="eyebrow" data-i18n="eyebrow">お部屋のご案内</p>
  <h1 data-i18n="h1">玄関の開け方</h1>
  <p class="lede" data-i18n="lede">玄関のドアは、暗証番号式の鍵です。番号を押すだけでなく、つまみを回す操作が必要です。</p>
</header>

        <h2 data-i18n="s1_h">暗証番号を押す</h2>

  lock_alt:{"ja":"玄関の暗証番号式ドアロック","en":"Keypad lock on the front door","zh-CN":"玄关的密码式门锁","zh-TW":"玄關的密碼式門鎖","ko":"현관의 비밀번호식 도어락"},

  s1_p:{"ja":"「C」ボタンを押してから、事前にお伝えした番号のボタンを順番に押してください。","en":"Press the 'C' button, then enter the code we shared with you in order.","zh-CN":"请先按下「C」按钮，再依序按下事先告知的密码数字。","zh-TW":"請先按下「C」按鈕，再依序按下事先告知的密碼數字。","ko":"'C' 버튼을 누른 후, 사전에 안내드린 번호를 순서대로 눌러 주세요."},
  s2_h:{"ja":"つまみを右に回す","en":"Turn the knob to the right","zh-CN":"将旋钮向右转动","zh-TW":"將旋鈕向右轉動","ko":"손잡이를 오른쪽으로 돌리기"},

<script>
(function(){
  var lang = "ja";
  var LABEL={ja:"JA",en:"EN","zh-CN":"简","zh-TW":"繁",ko:"한"};
  function t(k){ var e=T[k]; if(!e) return k; return e[lang]||e.en||e.ja; }
  function render(){
    document.documentElement.lang = lang;
    document.getElementById("langbtn").textContent = LABEL[lang];
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-alt]").forEach(function(el){
      el.setAttribute("alt", t(el.getAttribute("data-i18n-alt")));
    });
    document.querySelectorAll("#langsheet [data-lang]").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-lang")===lang);
    });
  }
  var scrim=document.getElementById("scrim"), sheet=document.getElementById("langsheet");
  function openSheet(){ scrim.classList.add("open"); sheet.classList.add("open"); }
  function closeSheet(){ scrim.classList.remove("open"); sheet.classList.remove("open"); }
  document.getElementById("langbtn").addEventListener("click", openSheet);
  scrim.addEventListener("click", closeSheet);
  document.querySelectorAll("#langsheet [data-lang]").forEach(function(b){
    b.addEventListener("click", function(){ lang=b.getAttribute("data-lang"); render(); closeSheet(); });
  });
  (function(){
    var n=(navigator.language||"ja").toLowerCase();
    if(n.indexOf("ko")===0) lang="ko";
    else if(n.indexOf("zh")===0) lang=(n.indexOf("tw")>-1||n.indexOf("hk")>-1||n.indexOf("hant")>-1)?"zh-TW":"zh-CN";
    else if(n.indexOf("ja")===0) lang="ja";
    else lang="en";
  })();
  try{ var q=new URLSearchParams(location.search).get("lang");
    if(q && {ja:1,en:1,"zh-CN":1,"zh-TW":1,ko:1}[q]) lang=q; }catch(e){}
  render();
})();
</script>
