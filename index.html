<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>izu high village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#FFFFFF;--sub:#F7F7F8;--ink:#3C3C3C;--ink-2:#8A8A8A;
  --line:#E4E4E6;--edge:#D9D9E3;--accent:#E1733C;--accent-ink:#CF6229;
  --red:#E03B2F;--base:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181B;--sub:#1D2125;--ink:#E6E6E6;--ink-2:#9A9A9A;
    --line:#2C3136;--edge:#343A41;--accent:#E1733C;--accent-ink:#EC8B5B;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B;--sub:#1D2125;--ink:#E6E6E6;--ink-2:#9A9A9A;
  --line:#2C3136;--edge:#343A41;--accent:#E1733C;--accent-ink:#EC8B5B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-size:var(--base);line-height:1.7;padding-bottom:72px;
}
html[lang="en"] body{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
html[lang="zh-CN"] body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
html[lang="zh-TW"] body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
html[lang="ko"] body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.app{max-width:480px;margin:0 auto;position:relative}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.brandmark{
  flex:0 0 auto;background:var(--accent);color:#fff;border-radius:5px;
  padding:5px 8px;font-size:10px;line-height:1.15;letter-spacing:.02em;text-align:center;font-weight:500;
}
.stay{flex:1;min-width:0;line-height:1.25}
.stay b{display:block;font-size:12.5px;font-weight:500;color:var(--accent-ink)}
.stay span{display:block;font-size:11.5px;color:var(--ink-2)}
.topbtn{
  appearance:none;background:transparent;border:1px solid var(--line);border-radius:6px;
  padding:5px 7px;cursor:pointer;color:var(--ink);flex:0 0 auto;
  font:500 10px/1.2 "Zen Kaku Gothic New",sans-serif;text-align:center;min-width:34px;
}
.topbtn.plain{border:0;padding:5px 4px;min-width:0}
.topbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;display:block}

}
.circles{position:absolute;left:0;right:0;top:100%;transform:translateY(-39px);display:flex;justify-content:center;gap:100px}
.circ{background:transparent;border:0;cursor:pointer;display:block;text-align:center;padding:0}
.circ i{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;background:var(--accent);margin:0 auto}
.circ i svg{width:34px;height:34px;stroke:#fff;fill:none}
.circ b{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);margin-top:4px}

.sizerow{display:flex;align-items:center;gap:10px;padding:72px 16px 4px;font-size:14px}
.switch{width:52px;height:27px;border-radius:99px;background:var(--line);border:0;padding:3px;cursor:pointer;display:flex}
.switch span{width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-pressed="true"]{background:#2F7BE8}
.switch[aria-pressed="true"] span{transform:translateX(25px)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px 12px 0}
.tile{
  background:var(--bg);border:1px solid var(--line);border-bottom:2px solid var(--edge);
  border-radius:7px;aspect-ratio:1/.92;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--ink-2);font-size:12px;font-weight:500;line-height:1.3;text-align:center;padding:6px;
  font-family:inherit;
}
.tile:active{background:var(--sub)}
.tile svg{width:31px;height:31px;stroke:var(--ink-2);fill:none;stroke-width:1.5;flex:0 0 auto}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.faq{
  display:flex;align-items:center;gap:9px;width:calc(100% - 24px);margin:22px 12px 10px;
  background:var(--accent);color:#fff;border:0;border-radius:99px;
  padding:14px 18px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
}
.faq svg{width:18px;height:18px;stroke:#fff;fill:none;flex:0 0 auto}
.faq .chev{margin-left:auto;width:11px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg) translate(-2px,-2px);flex:0 0 auto}

.legal{padding:8px 16px 28px;font-size:11px;color:var(--ink-2);text-align:center;line-height:2}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  background:transparent;border:0;cursor:pointer;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-2);position:relative;font-family:inherit;
}
.nav button svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.6}
.nav button[aria-current="page"]{color:var(--accent-ink)}
.nav button[aria-current="page"] svg{stroke:var(--accent)}
.dot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--red)}

.sheet{
  position:fixed;inset:0;z-index:40;background:var(--bg);
  transform:translateY(100%);transition:transform .22s ease;
  overflow-y:auto;max-width:480px;margin:0 auto;
}
.sheet.open{transform:translateY(0)}
@media (prefers-reduced-motion: reduce){.sheet,.langsheet{transition:none}}
.sheethead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:13px 14px}
.sheethead h2{margin:0;font-size:16px;font-weight:700;flex:1}
.close{appearance:none;background:transparent;border:0;cursor:pointer;font-size:26px;line-height:1;color:var(--ink-2);padding:0 4px}
.sheetbody{padding:18px 18px 60px;font-size:14.5px}
.sheetbody p{margin:0 0 12px}
.sheetbody ul{margin:0 0 12px;padding-left:1.2em}
.sheetbody li{margin-bottom:6px}
.sheetbody h3{margin:22px 0 8px;font-size:14px;font-weight:700;color:var(--accent-ink)}
.sheetbody h3:first-child{margin-top:0}
.fill{color:#B4762A;border-bottom:1.5px dotted #B4762A;font-weight:700}
.kv{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.kv:first-child{border-top:0}
.kv .k{flex:0 0 84px;font-size:12px;color:var(--ink-2)}
.kv .v{flex:1;font-size:17px;font-weight:700;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.copy{appearance:none;border:1px solid var(--line);background:transparent;color:var(--accent-ink);border-radius:7px;padding:7px 11px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.copy.done{background:var(--accent);border-color:var(--accent);color:#fff}
.tel{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;border-radius:99px;padding:14px;font-weight:700;margin:6px 0 12px}
.linkbtn{
  display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--accent-ink);
  border:1px solid var(--accent);border-radius:99px;padding:12px 18px;margin:4px 0 14px;
  font-size:14px;font-weight:500;
}
.linkbtn .chev{margin-left:auto;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);flex:0 0 auto}
.shop{border-top:1px solid var(--line);padding:13px 0}
.shop b{display:block;font-size:14.5px}
.shop em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-bottom:5px}
.shop span{display:block;font-size:13.5px}
.callout{background:var(--sub);border-radius:9px;padding:13px 15px;margin:0 0 12px;font-size:13.5px}
.callout.warn{border-left:3px solid var(--accent);border-radius:4px 9px 9px 4px}

/* 写真でコメント */
.howto{display:inline-flex;align-items:center;gap:7px;color:var(--accent-ink);font-size:14px;font-weight:500;cursor:pointer;background:transparent;border:0;padding:0;margin:0 0 16px;font-family:inherit}
.howto svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:1.7}
.shot{position:relative;border:1px solid var(--line);border-radius:6px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;margin-bottom:10px;background:var(--bg)}
.shot .corner{position:absolute;width:26px;height:26px;border:2px solid var(--line)}
.shot .c1{top:12px;left:12px;border-right:0;border-bottom:0}
.shot .c2{top:12px;right:12px;border-left:0;border-bottom:0}
.shot .c3{bottom:12px;left:12px;border-right:0;border-top:0}
.shot .c4{bottom:12px;right:12px;border-left:0;border-top:0}
.shot .plus{font-size:44px;color:var(--line);line-height:1;font-weight:300}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shotbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:transparent;border:0;color:var(--accent-ink);font-size:15px;font-weight:500;cursor:pointer;padding:6px 0 4px;font-family:inherit}
.shotbtn svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6}
.shotnote{text-align:right;font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:0 0 18px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat{background:transparent;border:1px solid transparent;border-radius:8px;padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-2);font-size:11.5px;font-weight:500;font-family:inherit}
.cat svg{width:26px;height:26px;stroke:var(--ink-2);fill:none;stroke-width:1.6}
.cat[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.cat[aria-pressed="true"] svg{stroke:var(--accent)}
.cmt{width:100%;min-height:86px;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--bg);resize:vertical}
.send{width:100%;margin-top:14px;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.sendmsg{margin:12px 0 0;font-size:13.5px;text-align:center;min-height:1.2em}
.sendmsg.ok{color:var(--accent-ink);font-weight:700}
.sendmsg.ng{color:#C0392B}
.send[disabled]{opacity:.55;cursor:default}
.steps{counter-reset:st;margin:0 0 4px;padding:0;list-style:none}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;margin-bottom:13px;font-size:14px}
.steps li::before{content:counter(st);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.open{opacity:1;pointer-events:auto}
.langsheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;
  background:var(--bg);border-radius:16px 16px 0 0;padding:6px 0 max(10px,env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;
}
.langsheet.open{transform:translateY(0)}
.langsheet h3{margin:0;padding:16px 20px 10px;font-size:13px;font-weight:500;color:var(--ink-2)}
.langsheet button{

  /* --- 連絡する --- */
  sos_1:{ja:"滞在中のご質問やご相談は、予約サイトのチャットへメッセージをお送りください。",en:"For questions during your stay, please message us through the booking site chat.","zh-CN":"入住期间如有疑问，请通过预订网站的聊天功能联系我们。","zh-TW":"入住期間如有疑問，請透過訂房網站的聊天功能聯絡我們。",ko:"숙박 중 문의사항은 예약 사이트 채팅으로 메시지를 보내주세요."},

  /* --- 設備・備品 --- */
  guide_lead:{ja:"この宿では、「暮らすように過ごせる最低限」と「くつろぎ」を大切にしています。",en:"We aim for just enough to live comfortably, and room to relax.","zh-CN":"本住宿重视「如同生活般的最低限度」与「放松」。","zh-TW":"本住宿重視「如同生活般的最低限度」與「放鬆」。",ko:"이 숙소는 '생활하듯 지낼 수 있는 최소한'과 '편안함'을 중요하게 생각합니다."},
  h_basic:{ja:"ご滞在の基本",en:"The basics"},
  basic_1:{ja:"チェックイン 16:00〜／チェックアウト 〜10:00",en:"Check-in from 16:00 / Check-out by 10:00","zh-CN":"入住 16:00起／退房 10:00前","zh-TW":"入住 16:00起／退房 10:00前",ko:"체크인 16:00부터 / 체크아웃 10:00까지"},
  basic_2:{ja:"セルフチェックインとなります。",en:"Self check-in.","zh-CN":"为自助入住。","zh-TW":"為自助入住。",ko:"셀프 체크인입니다."},
  h_room:{ja:"室内・共用スペース",en:"Living space"},

  li_kitchen:{ja:"冷蔵庫・冷凍庫 ／ ガスコンロ（2口） ／ 電子レンジ・トースター ／ 炊飯器・電気ポット ／ コーヒーメーカー（ドリップ式） ／ 調理器具・食器・ワイングラス ／ 油・塩・こしょう",en:"Fridge & freezer / two-burner gas stove / microwave & toaster / rice cooker & kettle / drip coffee maker / cookware, tableware, wine glasses / oil, salt, pepper"},
  li_bathamen:{ja:"バスタブ・給湯 ／ シャンプー・ボディソープ ／ タオル・シーツ類 ／ ヘアドライヤー ／ 温水洗浄便座",en:"Bathtub & hot water / shampoo & body soap / towels & linens / hair dryer / washlet toilet seat"},
  li_kids:{ja:"ベビーチェア ／ 子ども用の本・おもちゃ",en:"High chair / children's books and toys"},
  li_other:{ja:"洗濯機・物干しラック ／ ボードゲーム ／ 屋外用家具 ／ 火災報知器・消火器",en:"Washing machine & drying rack / board games / outdoor furniture / smoke alarm & fire extinguisher"},
  guide_note:{ja:"BBQグリルは有料オプションです。最新設備やホテル同等のサービスはありませんが、清掃と快適さを大切にしています。",en:"The BBQ grill is a paid option. We don't offer hotel-level service or the newest fittings, but we care about cleanliness and comfort."},

  /* --- ごみ --- */
  gomi_1:{ja:"ゴミはキッチンで2つに分別してください。",en:"Please separate rubbish into two categories in the kitchen.","zh-CN":"请在厨房将垃圾分为两类。","zh-TW":"請在廚房將垃圾分為兩類。",ko:"쓰레기는 주방에서 두 가지로 분리해 주세요."},
  gomi_2:{ja:"「カン・びん・ペットボトル」",en:"Cans, bottles and PET bottles","zh-CN":"「罐・瓶・塑料瓶」","zh-TW":"「罐・瓶・寶特瓶」",ko:"「캔・병・페트병」"},

  /* --- お風呂・トイレ --- */
  h_bath:{ja:"お風呂",en:"Bath","zh-CN":"浴室","zh-TW":"浴室",ko:"욕실"},
  bath_1:{ja:"追い焚き機能はありません。",en:"The bath has no reheating function.","zh-CN":"浴缸没有再加热功能。","zh-TW":"浴缸沒有再加熱功能。",ko:"욕조에 재가열 기능은 없습니다."},
  bath_2:{ja:"お湯の温度は、キッチンの流し台にあるリモコンから調整できます。ぬるく感じた場合はこちらをご確認ください。",en:"Water temperature is adjusted from the remote control at the kitchen sink. If the water feels lukewarm, please check there.","zh-CN":"热水温度可通过厨房水槽处的遥控器调整。若感觉水温偏低，请查看该处。","zh-TW":"熱水溫度可透過廚房水槽處的遙控器調整。若感覺水溫偏低，請查看該處。",ko:"온수 온도는 주방 싱크대의 리모컨에서 조절할 수 있습니다. 미지근하게 느껴지면 그곳을 확인해 주세요."},
  bath_3:{ja:"冬場は43℃に設定していますが、停電やブレーカーが落ちた場合、40℃に戻ることがあります。その際もリモコンで再設定できます。",en:"In winter it is set to 43°C, but after a power cut or tripped breaker it may reset to 40°C. You can set it again with the remote.","zh-CN":"冬季设定为43℃，但停电或跳闸后可能恢复为40℃。此时可用遥控器重新设定。","zh-TW":"冬季設定為43℃，但停電或跳閘後可能恢復為40℃。此時可用遙控器重新設定。",ko:"겨울에는 43℃로 설정되어 있으나 정전이나 차단기가 내려가면 40℃로 돌아갈 수 있습니다. 리모컨으로 다시 설정하실 수 있습니다."},
  h_toilet:{ja:"トイレ",en:"Toilet","zh-CN":"卫生间","zh-TW":"洗手間",ko:"화장실"},
  toilet_1:{ja:"男性の方も座ってご利用をお願いします。",en:"All guests are kindly asked to sit when using the toilet.","zh-CN":"请所有客人坐着使用卫生间。","zh-TW":"請所有客人坐著使用洗手間。",ko:"남성분도 앉아서 이용해 주시기 바랍니다."},
  toilet_2:{ja:"トイレットペーパー以外は流さないようお願いします。",en:"Please do not flush anything other than toilet paper.","zh-CN":"请勿冲入卫生纸以外的物品。","zh-TW":"請勿沖入衛生紙以外的物品。",ko:"화장지 외에는 변기에 버리지 말아 주세요."},

  /* --- BBQ --- */
  bbq_fee:{ja:"BBQセットは有料レンタル（3,000円）です。ご予約時にお支払い済みの場合は不要です。",en:"The BBQ set is a paid rental (¥3,000). Nothing further is due if you already paid at booking.","zh-CN":"烧烤套装为付费租借（3,000日元）。若已在预订时付款则无需再付。","zh-TW":"烤肉組合為付費租借（3,000日圓）。若已於訂房時付款則無需再付。",ko:"바비큐 세트는 유료 대여(3,000엔)입니다. 예약 시 결제하셨다면 추가 결제는 없습니다."},
  bbq_notice:{ja:"ご利用前に必ずご連絡ください。ご予約されたサイト（Airbnb / Booking.com等）のメッセージ機能から、事前に管理会社までご一報を。未払いの場合、お支払いはご利用後で構いません。",en:"Please tell us before you use it, via the message function of your booking site (Airbnb, Booking.com, etc.). If unpaid, you can settle after use.","zh-CN":"使用前请务必联系我们。请通过预订网站（Airbnb / Booking.com等）的消息功能事先告知管理公司。未付款的情况可于使用后支付。","zh-TW":"使用前請務必聯絡我們。請透過訂房網站（Airbnb / Booking.com等）的訊息功能事先告知管理公司。未付款的情況可於使用後支付。",ko:"이용 전 반드시 연락해 주세요. 예약하신 사이트(Airbnb / Booking.com 등)의 메시지 기능으로 관리회사에 미리 알려주시기 바랍니다. 미결제인 경우 이용 후 결제하셔도 됩니다."},
  bbq_time:{ja:"BBQなど屋外での飲食は20:00までとさせていただいています。",en:"Outdoor dining, including BBQ, is until 20:00.","zh-CN":"包括烧烤在内的户外用餐请于20:00前结束。","zh-TW":"包括烤肉在內的戶外用餐請於20:00前結束。",ko:"바비큐 등 실외 식사는 20:00까지입니다."},
  h_kit:{ja:"セットの内容",en:"What's included"},
  bbq_kit:{ja:"木炭／着火剤／チャッカマン／炭ハサミ／炭トング／グローブ／網ホルダー",en:"Charcoal / firelighter / lighter / charcoal tongs and grips / gloves / grill-grate holder"},
  h_tips:{ja:"ご利用中のポイント",en:"Tips"},
  bbq_t1:{ja:"肉用トングは、キッチンのカトラリーケースにあります。",en:"Tongs for meat are in the kitchen cutlery case.","zh-CN":"夹肉夹子放在厨房的餐具盒内。","zh-TW":"夾肉夾子放在廚房的餐具盒內。",ko:"고기용 집게는 주방 커틀러리 케이스에 있습니다."},
  bbq_t2:{ja:"バルコニーは幅が限られているため、焼き作業は屋外、食事は室内がおすすめです。",en:"The balcony is narrow, so we suggest grilling outside and eating indoors.","zh-CN":"阳台宽度有限，建议在户外烧烤、室内用餐。","zh-TW":"陽台寬度有限，建議在戶外燒烤、室內用餐。",ko:"발코니가 좁으므로 굽는 작업은 실외에서, 식사는 실내에서 하시길 권합니다."},
  bbq_t3:{ja:"座って焼くとゆっくり楽しめます。スツールをご利用ください。",en:"Grilling is easier seated — please use the stools.","zh-CN":"坐着烧烤更轻松，请使用凳子。","zh-TW":"坐著燒烤更輕鬆，請使用椅凳。",ko:"앉아서 구우면 여유롭게 즐기실 수 있습니다. 스툴을 이용해 주세요."},
  bbq_t4:{ja:"万が一に備えて、消火用の布をご用意しています。",en:"A fire blanket is available for safety.","zh-CN":"备有灭火毯以防万一。","zh-TW":"備有滅火毯以防萬一。",ko:"만일에 대비해 소화용 천을 준비해 두었습니다."},
  bbq_food:{ja:"冷蔵庫に少量の調味料（油・醤油・塩こしょうなど）をご用意していますが、食材・調味料は基本的にご持参ください。",en:"A little oil, soy sauce, salt and pepper are in the fridge, but please bring your own food and seasonings.","zh-CN":"冰箱内备有少量调味料（油・酱油・盐胡椒等），但食材与调味料原则上请自行准备。","zh-TW":"冰箱內備有少量調味料（油・醬油・鹽胡椒等），但食材與調味料原則上請自行準備。",ko:"냉장고에 소량의 조미료(기름・간장・소금후추 등)가 있으나 식재료와 조미료는 기본적으로 지참해 주세요."},

  /* --- ペット --- */
  dog_1:{ja:"小型犬に限り、3匹まで同伴いただけます。猫はご遠慮ください。",en:"Small dogs only, up to three. We cannot accept cats.","zh-CN":"仅限小型犬，最多3只。猫恕不接待。","zh-TW":"僅限小型犬，最多3隻。貓恕不接待。",ko:"소형견에 한해 3마리까지 동반 가능합니다. 고양이는 받지 않습니다."},
  dog_fee:{ja:"ペット料金は1滞在につき3,000円です。",en:"The pet fee is \u00a53,000 per stay.","zh-CN":"宠物费用为每次住宿3,000日元。","zh-TW":"寵物費用為每次住宿3,000日圓。",ko:"반려동물 요금은 1회 숙박당 3,000엔입니다."},
  dog_notice:{ja:"ご予約サイトによっては、ペット料金が宿泊料金に含まれているように見える場合がありますが、別途申し受けております。ワンちゃんとご一緒で、まだご連絡をいただいていない場合は、ご予約サイトのメッセージ機能からご一報のうえ、お支払いをお願いいたします。",en:"On some booking sites the pet fee can look as though it is already included in the room rate. It is charged separately. If you have your dog with you and have not told us yet, please message us through your booking site so we can arrange payment.","zh-CN":"在部分预订网站上，宠物费用可能看起来已包含在住宿费中，但实际为另行收取。如您携犬同行且尚未与我们联系，请通过预订网站的消息功能告知，并完成支付。","zh-TW":"在部分訂房網站上，寵物費用可能看起來已包含在住宿費中，但實際為另行收取。如您攜犬同行且尚未與我們聯絡，請透過訂房網站的訊息功能告知，並完成支付。","ko":"일부 예약 사이트에서는 반려동물 요금이 숙박료에 포함된 것처럼 보일 수 있으나 별도로 부과됩니다. 반려견과 함께 오셨는데 아직 연락을 주지 않으셨다면 예약 사이트 메시지로 알려주시고 결제를 부탁드립니다."},
  dog_2:{ja:"ソファや布団の上には乗せないようお願いいたします。",en:"Please keep dogs off the sofas and futons.","zh-CN":"请勿让犬只上沙发或被褥。","zh-TW":"請勿讓犬隻上沙發或被褥。",ko:"소파나 이불 위에는 올리지 말아 주세요."},
  dog_3:{ja:"慣れない環境で粗相してしまう場合がありますので、ワンちゃんにはオムツの着用をお願いいたします。",en:"Dogs can be nervous in an unfamiliar place, so please have them wear diapers during your stay.","zh-CN":"犬只在陌生环境可能会失禁，请为爱犬穿着尿布。","zh-TW":"犬隻在陌生環境可能會失禁，請為愛犬穿著尿布。",ko:"낯선 환경에서 실수할 수 있으므로 반려견에게 기저귀를 착용시켜 주세요."},
  dog_4:{ja:"汚れが生じた場合は、別途清掃費をお願いすることがあります。",en:"If anything becomes soiled, an additional cleaning fee may apply.","zh-CN":"若造成污损，可能另行收取清洁费。","zh-TW":"若造成污損，可能另行收取清潔費。",ko:"오염이 발생한 경우 별도의 청소비를 청구할 수 있습니다."},

  /* --- 室内でのお願い --- */
  in_1:{ja:"室内は禁煙です。喫煙は屋外でお願いいたします。",en:"No smoking indoors. Please smoke outside.","zh-CN":"室内禁烟。吸烟请到室外。","zh-TW":"室內禁菸。吸菸請到室外。",ko:"실내는 금연입니다. 흡연은 실외에서 부탁드립니다."},
  in_2:{ja:"靴は玄関でお脱ぎいただき、スリッパをご利用ください。",en:"Please remove your shoes at the entrance and use the slippers provided.","zh-CN":"请在玄关脱鞋，并使用拖鞋。","zh-TW":"請在玄關脫鞋，並使用拖鞋。",ko:"현관에서 신발을 벗고 슬리퍼를 이용해 주세요."},
  in_3:{ja:"バスタオルとフェイスタオルは、お一人様1枚ずつご用意しています。繰り返し大切に使っているため、お持ち帰りはご遠慮ください。",en:"One bath towel and one face towel are provided per guest. These are reused, so please do not take them with you.","zh-CN":"每位客人备有浴巾与面巾各一条。这些均为重复使用物品，请勿带走。","zh-TW":"每位客人備有浴巾與面巾各一條。這些均為重複使用物品，請勿帶走。",ko:"목욕 타월과 세면 타월은 1인당 1장씩 준비되어 있습니다. 반복해서 사용하는 물품이므로 가져가지 말아 주세요."},
  h_sec:{ja:"ご利用人数・防犯について",en:"Guests & security","zh-CN":"入住人数与安全","zh-TW":"入住人數與安全",ko:"이용 인원・방범"},
  sec_1:{ja:"当施設は、予約時にご登録いただいた宿泊者様のみご利用いただけます。",en:"Only guests registered on the reservation may use the property.","zh-CN":"本设施仅限预订时登记的住宿者使用。","zh-TW":"本設施僅限訂房時登記的住宿者使用。",ko:"본 시설은 예약 시 등록하신 숙박자만 이용하실 수 있습니다."},
  sec_2:{ja:"防犯・安全管理のため、玄関に防犯カメラを設置しています。",en:"For safety and security, a camera is installed at the entrance.","zh-CN":"为安全管理，玄关设有监控摄像头。","zh-TW":"為安全管理，玄關設有監視攝影機。",ko:"방범・안전 관리를 위해 현관에 방범 카메라가 설치되어 있습니다."},
  sec_3:{ja:"人数の変更やご事情がある場合は、事前にご相談いただけましたら幸いです。",en:"If the number of guests changes, please let us know in advance.","zh-CN":"如人数有变动，请事先与我们联系。","zh-TW":"如人數有變動，請事先與我們聯絡。",ko:"인원 변경이나 사정이 있으시면 사전에 상담해 주시면 감사하겠습니다."},

  /* --- 夜と自然 --- */
  night_1:{ja:"21時以降は、近隣への配慮のため窓を閉めて静かにお過ごしください。",en:"After 21:00, please close the windows and keep noise down out of consideration for our neighbours.","zh-CN":"21点以后，为顾及邻近住户，请关闭窗户并保持安静。","zh-TW":"21點以後，為顧及鄰近住戶，請關閉窗戶並保持安靜。",ko:"21시 이후에는 이웃을 배려하여 창문을 닫고 조용히 지내주시기 바랍니다."},
  night_2:{ja:"izu high village は自然に囲まれた場所にあります。季節や天候によっては室内に虫が入ってくることがあります。",en:"izu high village sits in a nature-rich area. Depending on the season or weather, insects may come indoors.","zh-CN":"izu high village 位于自然环绕之地。视季节与天气，室内可能会有虫子进入。","zh-TW":"izu high village 位於自然環繞之地。視季節與天氣，室內可能會有蟲子進入。",ko:"izu high village는 자연에 둘러싸인 곳에 있습니다. 계절이나 날씨에 따라 실내에 벌레가 들어올 수 있습니다."},
  night_3:{ja:"玄関・リビング・ダイニングの棚に殺虫剤をご用意していますので、必要に応じてご利用ください。",en:"Insect spray is on the shelves in the entrance, living room and dining area — please use it as needed.","zh-CN":"玄关、客厅、餐厅的架子上备有杀虫剂，请按需使用。","zh-TW":"玄關、客廳、餐廳的架子上備有殺蟲劑，請按需使用。",ko:"현관・거실・다이닝 선반에 살충제를 준비해 두었으니 필요에 따라 사용해 주세요."},

  /* --- 駐車 --- */
  park_1:{ja:"建物前が駐車スペースになります。道路が少し狭いため、ゆっくりお進みください。",en:"Parking is in front of the building. The road is a little narrow, so please drive slowly.","zh-CN":"停车位于建筑物前方。道路略窄，请缓慢行驶。","zh-TW":"停車位於建築物前方。道路略窄，請緩慢行駛。",ko:"건물 앞이 주차 공간입니다. 도로가 다소 좁으니 천천히 진입해 주세요."},
  park_2:{ja:"玄関ドアを開けるため、建物側に寄せすぎず、少し余裕をもって停めてください。",en:"Please leave space to open the entrance door — don't park too close to the building.","zh-CN":"为便于开启玄关门，请勿过于靠近建筑物停车，留出一些空间。","zh-TW":"為便於開啟玄關門，請勿過於靠近建築物停車，留出一些空間。",ko:"현관문을 열 수 있도록 건물 쪽으로 너무 붙이지 말고 여유를 두고 주차해 주세요."},
  park_3:{ja:"敷地内の駐車は基本的に1台分です。軽自動車のように車体が小さい場合は2台目も可能なことがありますが、状況に応じてお客様ご自身のご判断でお願いいたします。",en:"On-site parking is basically for one car. A second small car (a kei car, for example) may fit, but please judge for yourself depending on the situation.","zh-CN":"场地内停车原则上为1辆。若为轻型车等小型车辆，有时可停第2辆，但请视情况自行判断。","zh-TW":"場地內停車原則上為1輛。若為輕型車等小型車輛，有時可停第2輛，但請視情況自行判斷。",ko:"부지 내 주차는 기본적으로 1대분입니다. 경차처럼 차체가 작은 경우 2대째도 가능할 수 있으나 상황에 따라 직접 판단해 주시기 바랍니다."},
  park_4:{ja:"少しでも不安を感じる場合は、宇佐美駅近くの有料コインパーキングのご利用をおすすめします。",en:"If you feel at all unsure, we recommend the paid parking near Usami Station.","zh-CN":"若有任何不安，建议使用宇佐美站附近的付费停车场。","zh-TW":"若有任何不安，建議使用宇佐美站附近的付費停車場。",ko:"조금이라도 불안하시면 우사미역 근처의 유료 코인 주차장 이용을 권해드립니다."},

  /* --- チェックアウト --- */
  co_1:{ja:"チェックアウトは10:00までです。",en:"Check-out is by 10:00.","zh-CN":"退房时间为10:00前。","zh-TW":"退房時間為10:00前。",ko:"체크아웃은 10:00까지입니다."},
  co_2:{ja:"アーリーチェックイン／レイトチェックアウト（有料）をご希望の場合は、空き状況によりご案内しますので事前にご相談ください。",en:"Early check-in and late check-out are available for a fee, subject to availability — please ask in advance.","zh-CN":"如需提前入住／延迟退房（付费），将视空房情况安排，请事先咨询。","zh-TW":"如需提前入住／延遲退房（付費），將視空房情況安排，請事先洽詢。",ko:"얼리 체크인／레이트 체크아웃(유료)을 원하시면 공실 상황에 따라 안내드리니 미리 상담해 주세요."},
  co_3:{ja:"退出時の詳しい手順は、ご予約サイトのメッセージでお送りしています。そちらをご確認ください。",en:"Detailed check-out instructions are sent to you through your booking site's messages. Please check there.","zh-CN":"退房的详细步骤已通过预订网站的消息发送给您，请查阅。","zh-TW":"退房的詳細步驟已透過訂房網站的訊息發送給您，請查閱。",ko:"퇴실 시 자세한 절차는 예약 사이트 메시지로 보내드립니다. 그쪽을 확인해 주세요."},
  co_thanks:{ja:"izu high village にご宿泊いただき、ありがとうございました。また伊豆を訪れる機会がありましたら、ぜひお立ち寄りください。",en:"Thank you for staying at izu high village. We look forward to welcoming you again.","zh-CN":"感谢您入住 izu high village。若再有机会造访伊豆，欢迎再次光临。","zh-TW":"感謝您入住 izu high village。若再有機會造訪伊豆，歡迎再次光臨。",ko:"izu high village에 묵어주셔서 감사합니다. 다시 이즈를 찾으실 기회가 있다면 꼭 들러주세요."},

  /* --- MAP --- */
  map_1:{ja:"この宿周辺のおすすめ店舗をGoogleマップにまとめています。",en:"We've collected our recommended places nearby on Google Maps.","zh-CN":"我们已将周边推荐店铺整理在Google地图上。","zh-TW":"我們已將周邊推薦店家整理在Google地圖上。",ko:"숙소 주변 추천 가게를 Google 지도에 정리해 두었습니다."},
  map_2:{ja:"営業時間や定休日は変更になる場合があります。最新情報はGoogleマップをご確認ください。",en:"Opening hours and closing days may change. Please check Google Maps for the latest.","zh-CN":"营业时间与公休日可能变更，最新信息请查看Google地图。","zh-TW":"營業時間與公休日可能變更，最新資訊請查看Google地圖。",ko:"영업시간과 휴무일은 변경될 수 있습니다. 최신 정보는 Google 지도를 확인해 주세요."},

  /* --- おすすめのお店 --- */
  shops_lead:{ja:"あえてたくさんの飲食店はご紹介していません。私たち自身が実際に足を運び、「ここでいい」と思える場所だけを載せています。",en:"We deliberately list only a few places — ones we've been to ourselves and would happily go back to."},
  shops_buy:{ja:"買い出しについて（重要）",en:"Shopping for food (important)"},
  shops_buy_note:{ja:"徒歩圏内にスーパーやコンビニはありません。夜は周辺が暗くなるため、チェックイン前や明るいうちに買い出しを済ませておくことをおすすめします。BBQや自炊をご予定の方は、食材・飲み物を多めにご準備ください。",en:"There are no shops within walking distance, and it gets dark around the house at night. We recommend shopping before check-in or while it's still light. If you plan to barbecue or cook, buy more than you think you need."},
  h_shop1:{ja:"宿で食べる・買い出ししたい日",en:"Stocking up"},
  h_shop2:{ja:"今日は作らずに済ませたい日",en:"When you'd rather not cook"},
  h_shop3:{ja:"外で食べたい日",en:"Eating out"},
  h_shop4:{ja:"少し気分転換したいとき",en:"A change of scene"},
  s_nagaya:{ja:"伊東市周辺に展開する地元密着型のスーパー。宿から近く、さっと買い出ししたいときに。",en:"A local supermarket chain around Ito City. The closest option for a quick shop."},
  s_donki:{ja:"人数が多いときの買い出しならまずここ。食べ物・飲み物・日用品まで一通り揃います。",en:"Best when there are a lot of you — food, drink and household items all in one place."},
  s_aoki:{ja:"伊豆ならではの新鮮な魚や刺身が豊富。お肉の種類も多く、宿でゆっくり食事をしたい日に。",en:"Strong on fresh Izu fish and sashimi, with a good meat selection. For a proper meal at the house."},
  s_maruka:{ja:"お酒に合うおつまみや、手作りのお弁当・お惣菜が並ぶお店です。15時以降は割引になることもあります。",en:"Homemade bento and side dishes, plus snacks that go with a drink. Often discounted after 15:00."},
  s_maruka2:{ja:"マルカのすぐ隣。しらすせんべい・金目鯛せんべいなど、伊豆らしいお土産が手頃な価格で並びます。",en:"Right next door to Maruka. Izu souvenirs like whitebait and kinmedai crackers at reasonable prices."},
  s_ramen:{ja:"子ども連れでも利用しやすいラーメン店。子ども用の食器もあります。店内から海を眺めながら、丁寧なラーメンを楽しめます。週末や食事どきは混み合います。",en:"An easy ramen place with children — kids' tableware available. Sea views from inside, carefully made bowls. Busy at weekends and mealtimes."},
  s_fushimi:{ja:"12席ほどの小さな食堂。干物やお刺身が美味しく、地元の人が通う雰囲気です。席数が少ないため早めの来店がおすすめ。",en:"A small diner with about 12 seats. Good dried fish and sashimi, and a local rather than touristy feel. Go early — it fills up."},
  s_usami:{ja:"宿から車で約7分の海岸。駐車場が近くにあり立ち寄りやすい場所です。サーファーが多く、伊豆らしい海の景色を感じられます。",en:"A beach about seven minutes away by car, with parking close by. Popular with surfers and a good spot for a short break."},

  /* --- お知らせ・アンケート --- */
  news_empty:{ja:"現在、お知らせはありません。",en:"No notices at the moment.","zh-CN":"目前没有通知。","zh-TW":"目前沒有通知。",ko:"현재 공지사항이 없습니다."},
  survey_1:{ja:"ご滞在ありがとうございました。感じたことを教えていただけたら嬉しいです。",en:"Thank you for staying with us. If you enjoyed your stay, we would love to hear your thoughts.","zh-CN":"感谢您的入住。若能告诉我们您的感受，我们将非常高兴。","zh-TW":"感謝您的入住。若能告訴我們您的感受，我們將非常高興。",ko:"머물러 주셔서 감사합니다. 느끼신 점을 알려주시면 기쁘겠습니다."},

  btn_park_pdf:{ja:"写真つきの駐車ガイドを見る",en:"See the parking guide with photos","zh-CN":"查看附照片的停车指南","zh-TW":"查看附照片的停車指南",ko:"사진이 있는 주차 안내 보기"},
  btn_shops_pdf:{ja:"Googleマップでまとめて見る",en:"See them all on Google Maps","zh-CN":"在Google地图上查看全部","zh-TW":"在Google地圖上查看全部",ko:"Google 지도에서 한번에 보기"},
  btn_fire_video:{ja:"炭の着火方法を動画で見る",en:"Watch the charcoal lighting video","zh-CN":"观看点炭方法视频","zh-TW":"觀看點炭方法影片",ko:"숯 점화 방법 영상 보기"},
  btn_review:{ja:"Googleマップにクチコミを書く",en:"Leave a review on Google Maps","zh-CN":"在Google地图上写评价","zh-TW":"在Google地圖上寫評論",ko:"Google 지도에 리뷰 남기기"},

  h_question:{ja:"ご質問・ご相談",en:"Questions","zh-CN":"咨询","zh-TW":"諮詢",ko:"문의"},
  h_emergency:{ja:"緊急時",en:"Emergencies","zh-CN":"紧急情况","zh-TW":"緊急情況",ko:"긴급 시"},
  tel_emergency:{ja:"070-6450-0371 に電話",en:"Call 070-6450-0371","zh-CN":"拨打 070-6450-0371","zh-TW":"撥打 070-6450-0371",ko:"070-6450-0371로 전화"},
  plusline_name:{ja:"プラスライン株式会社（管理会社）",en:"Plusline Inc. (property manager)","zh-CN":"Plusline株式会社（管理公司）","zh-TW":"Plusline株式會社（管理公司）",ko:"Plusline 주식회사(관리회사)"},

  sightseeing:{ja:"観光案内",en:"Things to do","zh-CN":"观光指南","zh-TW":"觀光導覽",ko:"관광 안내"},
  sight_1:{ja:"伊東の観光情報は、伊東観光協会の公式サイトにまとまっています。季節のイベント、温泉、体験、見どころが探せます。",en:"The Ito Tourism Association's official site covers events, hot springs, activities and sights across the area.","zh-CN":"伊东的观光信息汇总于伊东观光协会官方网站，可查询季节活动、温泉、体验与景点。","zh-TW":"伊東的觀光資訊彙整於伊東觀光協會官方網站，可查詢季節活動、溫泉、體驗與景點。",ko:"이토의 관광 정보는 이토관광협회 공식 사이트에 정리되어 있습니다. 계절 이벤트, 온천, 체험, 볼거리를 찾을 수 있습니다."},
  btn_ito:{ja:"伊東観光協会のサイトを見る",en:"Visit the Ito Tourism Association site","zh-CN":"访问伊东观光协会网站","zh-TW":"造訪伊東觀光協會網站",ko:"이토관광협회 사이트 보기"}
};

var GAS_URL="https://script.google.com/macros/s/AKfycbyCcw4NL3As3JaNTPy-ZovrjXj3vCmzgQvhsUHcYGNDTUETn2s1kj159G6Jy3v9W65b/exec";
var GAS_TOKEN="ihv-guest-2026";
var LABEL={ja:"あA<br>JP",en:"Aあ<br>EN","zh-CN":"文A<br>简","zh-TW":"文A<br>繁",ko:"가A<br>KO"};
var lang="ja", big=false;

function t(k){ var e=T[k]; if(!e) return k; return e[lang]||e.en||e.ja; }
function p(k){ return '<p>'+t(k)+'</p>'; }
function h(k){ return '<h3>'+t(k)+'</h3>'; }
function fill(s){ return '<p><span class="fill">'+s+'</span></p>'; }
function btn(url,key){
  return '<a class="linkbtn" href="'+url+'" target="_blank" rel="noopener">'+t(key)+'<span class="chev"></span></a>';
}
function shop(name,meta,descKey){
  return '<div class="shop"><b>'+name+'</b><em>'+meta+'</em><span>'+t(descKey)+'</span></div>';
}

/* 【要記入】は運営側のメモなので日本語のまま固定 */
function content(key){
  switch(key){

  case "wifi": return {title:"Wi-Fi", body:
    p("wifi_lead")+
    '<div class="kv"><span class="k">'+t("network")+'</span><span class="v" id="ssid">準備中</span><button class="copy" data-copy="ssid">'+t("copy")+'</button></div>'+
    '<div class="kv"><span class="k">'+t("password")+'</span><span class="v" id="pass">準備中</span><button class="copy" data-copy="pass">'+t("copy")+'</button></div>'+
    ''};

  case "sos": return {title:t("contact"), body:
    h("h_question")+p("sos_1")+
    h("h_emergency")+p("sos_2")+
    '<a class="tel" href="tel:07064500371">'+t("tel_emergency")+'</a>'+
    '<p style="font-size:12.5px;color:var(--ink-2);margin-top:-4px">'+t("plusline_name")+'</p>'};

  case "guide": return {title:t("guide"), body:
    '<div class="callout">'+t("guide_lead")+'</div>'+
    h("h_basic")+p("basic_1")+p("basic_2")+
    h("h_room")+p("li_room")+
    h("h_kitchen")+p("li_kitchen")+
    h("h_bathamen")+p("li_bathamen")+
    h("h_kids")+p("li_kids")+
    h("h_other")+p("li_other")+
    '<p style="font-size:13px;color:var(--ink-2);margin-top:18px">'+t("guide_note")+'</p>'};

  case "map": return {title:t("map"), body:
    p("map_1")+
    btn("https://maps.app.goo.gl/eKVXcQDCfapgmKn6A","btn_shops_pdf")+
    '<p style="font-size:13px;color:var(--ink-2)">'+t("map_2")+'</p>'};

  case "night": return {title:t("night"), body:
    p("night_1")+p("night_2")+p("night_3")};

  case "washer": return {title:t("washer"), body:
    fill("【要記入：洗剤自動投入の説明。洗剤・柔軟剤の投入口の位置と入れ分け、補充の要否、基本のコース。投入口が写った写真があると確実です】")};

  case "sofabed": return {title:t("sofabed"), body:
    fill("【要記入：ソファベッドの展開手順／ソファマットレスの使い方。写真か短い動画があると伝わります】")+
    fill("【要記入：布団の場所。「1階◯◯の押入れ」のように階と部屋を明記。押入れを開けた写真が1枚あると説明が要らなくなります】")};

  case "photo": return {title:t("photo"), body:
    '<button class="howto" id="howtobtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 114 2.1c-.9.6-1.6 1.1-1.6 2.2M12 16.8v.4"/></svg>'+t("photo_howto")+'</button>'+
    '<div id="howtobox" hidden><ol class="steps">'+
      '<li>'+t("hw1")+'</li><li>'+t("hw2")+'</li><li>'+t("hw3")+'</li>'+
      '<li>'+t("hw4")+'</li><li>'+t("hw5")+'</li><li>'+t("hw6")+'</li>'+
    '</ol></div>'+
    '<p>'+t("photo_lead")+'</p>'+
    '<div class="shot" id="shotbox"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><span class="plus">+</span></div>'+
    '<input type="file" accept="image/*" capture="environment" id="shotinput" hidden>'+
    '<button class="shotbtn" id="shotbtn"><svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M4 7h3.5L9 5h6l1.5 2H20a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.4"/></svg>'+t("photo_shoot")+'</button>'+

function render(){
  document.documentElement.lang=lang;
  document.getElementById("langlabel").innerHTML=LABEL[lang];
  var ns=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<ns.length;i++){ ns[i].textContent=t(ns[i].getAttribute("data-i18n")); }
  var ls=document.querySelectorAll("#langsheet [data-lang]");
  for(var j=0;j<ls.length;j++){ ls[j].setAttribute("aria-selected", ls[j].getAttribute("data-lang")===lang); }
  if(sheet.classList.contains("open") && current) show(current);
  renderStay();
}

var sheet=document.getElementById("sheet"),
    sTitle=document.getElementById("sheettitle"),
    sBody=document.getElementById("sheetbody"),
    current=null;

function show(key){
  var c=content(key); if(!c) return;
  current=key; sTitle.textContent=c.title; sBody.innerHTML=c.body; bindCopy(); bindPhoto();
}

function bindPhoto(){
  var hb=document.getElementById("howtobtn"), hx=document.getElementById("howtobox");
  if(hb&&hx){ hb.addEventListener("click",function(){ hx.hidden=!hx.hidden; }); }

  var inp=document.getElementById("shotinput"), sb=document.getElementById("shotbtn"), box=document.getElementById("shotbox");
  if(inp&&sb&&box){
    sb.addEventListener("click",function(){ inp.click(); });
    box.addEventListener("click",function(){ inp.click(); });
    inp.addEventListener("change",function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      photoFile=f;
      var img=box.querySelector("img")||document.createElement("img");
      img.src=URL.createObjectURL(f); if(!img.parentNode) box.appendChild(img);
    });
  }

  var cats=sBody.querySelectorAll(".cat");
  for(var i=0;i<cats.length;i++){
    (function(b){
      b.addEventListener("click",function(){
        for(var j=0;j<cats.length;j++){ cats[j].setAttribute("aria-pressed","false"); }
        b.setAttribute("aria-pressed","true");
        photoCat=b.getAttribute("data-cat");
      });
    })(cats[i]);
  }

  var send=document.getElementById("sendbtn"), msg=document.getElementById("sendmsg");
  if(send&&msg){
    photoFile=null; photoCat=null;
    send.addEventListener("click",function(){
      msg.className="sendmsg";
      if(!photoFile){ msg.className="sendmsg ng"; msg.textContent=t("photo_need_img"); return; }
      if(!photoCat){ msg.className="sendmsg ng"; msg.textContent=t("photo_need_cat"); return; }
      send.disabled=true; msg.textContent=t("photo_sending");
      shrink(photoFile,1600,0.82).then(function(b64){
        return fetch(GAS_URL,{
          method:"POST",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify({token:GAS_TOKEN,category:photoCat,comment:document.getElementById("cmt").value,image:b64})
        });
      }).then(function(r){ return r.json(); }).then(function(res){
        if(!res||!res.ok) throw new Error(res&&res.error);
        msg.className="sendmsg ok"; msg.textContent=t("photo_done");
        photoFile=null; photoCat=null;
        var im=box&&box.querySelector("img"); if(im) im.remove();
        for(var j=0;j<cats.length;j++){ cats[j].setAttribute("aria-pressed","false"); }
        document.getElementById("cmt").value=""; if(inp) inp.value="";
      }).catch(function(){
        msg.className="sendmsg ng"; msg.textContent=t("photo_fail");
      }).then(function(){ send.disabled=false; });
    });
  }
}

var photoFile=null, photoCat=null;

// 長辺を max px に縮めて JPEG の base64 を返す
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.naturalWidth, h=img.naturalHeight, r=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q).split(",")[1]);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}
function open(key){ show(key); sheet.classList.add("open"); sheet.setAttribute("aria-hidden","false"); sheet.scrollTop=0; }

function bindCopy(){
  var bs=sBody.querySelectorAll(".copy");
  for(var i=0;i<bs.length;i++){
    (function(b){
      b.addEventListener("click",function(){
        var v=document.getElementById(b.getAttribute("data-copy")).textContent;
        var ok=function(){
          b.classList.add("done"); b.textContent=t("copied");
          setTimeout(function(){b.classList.remove("done");b.textContent=t("copy");},1600);
        };
        try{ navigator.clipboard.writeText(v).then(ok,function(){b.textContent=t("longpress");}); }
        catch(e){ b.textContent=t("longpress"); }
      });
    })(bs[i]);
  }
}

/* ===== 滞在状況の表示 ===== */
var stay=null;
function jst(ms){ var d=new Date(ms+9*3600000); return {m:d.getUTCMonth()+1,d:d.getUTCDate(),hm:("0"+d.getUTCHours()).slice(-2)+":"+("0"+d.getUTCMinutes()).slice(-2)}; }
function jday(ms){ return Math.floor((ms+9*3600000)/86400000); }
function fmt(str,o){ return str.replace(/\{(\w+)\}/g,function(_,k){ return o[k]; }); }

function renderStay(){
  var T_=document.getElementById("stayT"), S_=document.getElementById("stayS");
  if(!T_||!S_) return;
  var title="izu high village", sub=t("st_generic_s");
  if(stay){
    var now=Date.now(), ci=jst(stay.ci), co=jst(stay.co);
    var dNow=jday(now), dCi=jday(stay.ci), dCo=jday(stay.co);
    if(now<stay.ci){
      if(dCi===dNow){ title=t("st_today_in_t"); sub=fmt(t("st_from_sub"),{t:ci.hm}); }
      else { title=(dCi-dNow===1)?t("st_tomorrow_t"):fmt(t("st_before_t"),{n:dCi-dNow}); sub=fmt(t("st_in_sub"),{d:ci.m+"/"+ci.d,t:ci.hm}); }
    } else if(now<stay.co){
      if(dCo===dNow){ title=t("st_today_out_t"); sub=fmt(t("st_by_sub"),{t:co.hm}); }
      else { title=t("stay_title"); sub=fmt(t("st_out_sub"),{d:co.m+"/"+co.d,t:co.hm}); }
    } else if(dCo===dNow){ title=t("st_thanks_t"); sub=""; }
  }
  T_.textContent=title; S_.textContent=sub;
}

// ?in=2026-10-03（2026/10/03, 20261003 も可）→ その予約。なければ今日の予約。一度受け取った日付は端末に覚えさせる
(function(){
  var KEY="ihv_stay", reqIn=null, saved=null;
  try{ saved=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  if(saved&&saved.co&&saved.co<Date.now()-86400000){ try{ localStorage.removeItem(KEY); }catch(e){} saved=null; }
  var q=null; try{ q=new URLSearchParams(location.search).get("in"); }catch(e){}
  if(q){ q=q.replace(/\//g,"-"); if(/^\d{8}$/.test(q)) q=q.slice(0,4)+"-"+q.slice(4,6)+"-"+q.slice(6); }
  if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)) reqIn=q; else if(saved&&saved.in) reqIn=saved.in;
  fetch(GAS_URL+(reqIn?"?in="+reqIn:"")).then(function(r){ return r.json(); }).then(function(res){
    if(res&&res.ok&&res.stay){
      stay=res.stay;
      if(reqIn){ try{ localStorage.setItem(KEY,JSON.stringify({in:reqIn,co:stay.co})); }catch(e){} }
      renderStay();
    }
  }).catch(function(){});
})();

render();

})();
